<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f8f8f7">
	<meta name="description" content="Ask Almat AI a question.">
	<title>Almat AI</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-[#f8f8f7] text-[#20211f] antialiased">
	<header class="border-b border-black/[0.06] bg-white/80">
		<div class="mx-auto flex h-[76px] max-w-6xl items-center justify-between px-5 sm:px-8">
			<a href="#" class="flex items-center gap-3" aria-label="Almat AI home">
				<img src="logo.png" alt="" class="h-10 w-10 rounded-xl bg-white object-contain p-1 shadow-sm ring-1 ring-black/[0.06]">
				<span class="text-lg font-semibold tracking-[-0.04em]">almat <span class="font-medium text-[#777873]">ai</span></span>
			</a>
		</div>
	</header>

	<main class="mx-auto max-w-5xl px-5 pb-20 pt-20 sm:px-8 sm:pt-28">
		<section class="mx-auto max-w-3xl">
			<h1 class="text-center text-4xl font-semibold leading-[1.08] tracking-[-0.055em] sm:text-6xl">
				What can I help with?
			</h1>
		</section>

		<section class="mx-auto mt-8 max-w-3xl" aria-label="Ask a question">
			<form class="rounded-2xl border border-black/[0.09] bg-white p-3 shadow-[0_12px_40px_rgba(27,28,25,0.06)] transition focus-within:border-black/20 focus-within:shadow-[0_16px_48px_rgba(27,28,25,0.09)]">
				<label for="prompt" class="sr-only">Your prompt</label>
				<textarea id="prompt" name="prompt" rows="3" placeholder="Ask anything…"
					class="block w-full resize-y border-0 bg-transparent px-3 py-3 text-base leading-7 text-[#20211f] outline-none placeholder:text-[#a3a49f] focus:ring-0 sm:px-4"
					required></textarea>
				<div class="flex flex-col gap-3 border-t border-black/[0.06] px-2 pt-3 sm:flex-row sm:items-center sm:justify-between sm:px-3">
					<button type="submit" class="inline-flex items-center justify-center gap-2 rounded-xl bg-[#20211f] px-4 py-2.5 text-sm font-medium text-white transition hover:bg-[#383a36] focus:outline-none focus:ring-2 focus:ring-[#20211f] focus:ring-offset-2">
						<span>Send</span>
						<svg aria-hidden="true" viewBox="0 0 20 20" fill="none" class="h-4 w-4">
							<path d="M4.167 10h11.666M10 4.167 15.833 10 10 15.833" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
						</svg>
					</button>
				</div>
			</form>
			<p id="form-message" class="mt-3 min-h-5 text-center text-xs text-[#777873]" aria-live="polite"></p>
		</section>
	</main>
	<script>
		const API_URL = window.ALMAT_API_URL || "http://localhost:8000/api/ask";
		const promptInput = document.querySelector("#prompt");
		const formMessage = document.querySelector("#form-message");
		const submitButton = document.querySelector('button[type="submit"]');

		document.querySelector("form").addEventListener("submit", async (event) => {
			event.preventDefault();
			formMessage.textContent = "";
			submitButton.disabled = true;
			submitButton.classList.add("cursor-wait", "opacity-60");

			try {
				const response = await fetch(API_URL, {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ prompt: promptInput.value.trim() })
				});
				if (!response.ok) {
					throw new Error("Could not send your question. Please try again.");
				}
				formMessage.textContent = "Your question was sent.";
			} catch (error) {
				formMessage.textContent = error.message || "Could not reach Almat AI. Please try again.";
			} finally {
				submitButton.disabled = false;
				submitButton.classList.remove("cursor-wait", "opacity-60");
			}
		});
	</script>
</body>
</html>
